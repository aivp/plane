[project]
name = "plane-mcp-gateway"
version = "0.1.0"
description = "Stateless Remote MCP gateway for caller-provided Plane credentials"
requires-python = ">=3.11"
dependencies = [
    "plane-mcp-server @ https://github.com/makeplane/plane-mcp-server/archive/96cf4d51d65cfa5e47d10ff7a4a4caba3b7a98d1.tar.gz",
    "uvicorn==0.41.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plane_mcp_gateway"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
